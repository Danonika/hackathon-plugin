[mcp_servers.hackathonkit]
# POSIX launcher (Linux/macOS). Codex cannot execute a .sh on Windows: replace
# `command` below with "./plugins/hackathonkit/scripts/hackathonkit-mcp-launcher.cmd",
# or run scripts/setup.ps1, which generates plugins/hackathonkit/.mcp.json with the
# .cmd launcher for Windows.
command = "./plugins/hackathonkit/scripts/hackathonkit-mcp-launcher.sh"
args = []
startup_timeout_sec = 60
tool_timeout_sec = 120

# Web search is opt-in: set to "live" when $theme-research must verify external
# facts and the environment may reach the network.
web_search = "off"

# Appended to every prompt (additive, unlike model_instructions_file).
persistent_instructions = "Follow AGENTS.md. Call system.context before planning, use the Hackathon Agent Kit MCP tools for evidence, and never claim a result without a tool result behind it."
