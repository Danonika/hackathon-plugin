#:schema https://developers.openai.com/codex/config-schema.json

# Root-level Codex settings MUST appear before the first [table] header. TOML
# tables persist until the next header, so any key placed after
# [mcp_servers.hackathonkit] would be parsed as part of that server entry and
# silently ignored by the schema.

# Web search is opt-in: set to "live" when $theme-research must verify external
# facts and the environment may reach the network. While it is "disabled",
# $theme-research must use the provided corpus only and list unverifiable
# external facts as gaps instead of asserting them.
web_search = "disabled"

# Project instructions live in AGENTS.md. `persistent_instructions` is not a
# Codex 0.156 config key, so it is intentionally omitted here (it would be
# ignored).

# Fallback MCP registration (no plugin required). Codex loads this project
# config from any subdirectory, so the launcher path is resolved at launch from
# the repository root via `git rev-parse --show-toplevel` (it fails closed when
# not inside a checkout). scripts/gen-codex-config.sh additionally writes an
# absolute launcher path to the USER config ($CODEX_HOME/config.toml), which
# Codex applies with higher precedence.
# POSIX only: on Windows `sh` is unavailable, so run scripts/setup.ps1, which
# generates plugins/hackathonkit/.mcp.json with the Node launcher, or replace
# `command`/`args` below manually.
#
# The resolved root is passed to `sh` as a quoted argument, so a path containing
# spaces is preserved. Running the launcher through `sh` also avoids depending
# on the checkout's executable bit.
[mcp_servers.hackathonkit]
command = "sh"
args = ["-c", "unset GIT_DIR GIT_WORK_TREE; root=$(git rev-parse --show-toplevel) || { echo 'Hackathon Agent Kit: could not resolve the project checkout' >&2; exit 1; }; grep -Eq '^module[[:space:]]+hackathonkit[.]local/agentkit([[:space:]]|$)' \"$root/go.mod\" || { echo 'Hackathon Agent Kit: expected a Hackathon Agent Kit checkout' >&2; exit 1; }; exec sh \"$root/plugins/hackathonkit/scripts/hackathonkit-mcp-launcher.sh\""]
# 180s covers the docker-compose fallback on a cold machine (image pull/build +
# dependency startup). Raise further or pre-build images if your network is slow.
startup_timeout_sec = 180
# Slowest tools: ingestion, quality.gate and research passes. Raise per
# environment if these time out; there is no config-level retry.
tool_timeout_sec = 180
