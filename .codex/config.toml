#:schema https://developers.openai.com/codex/config-schema.json

# Root-level Codex settings MUST appear before the first [table] header. TOML
# tables persist until the next header, so any key placed after
# [mcp_servers.hackathonkit] would be parsed as part of that server entry and
# silently ignored by the schema.

# Web search is opt-in: set to "live" when $theme-research must verify external
# facts and the environment may reach the network. While it is "disabled",
# $theme-research must use the provided corpus only and list unverifiable
# external facts as gaps instead of asserting them.
web_search = "disabled"

# Appended to every prompt (additive, unlike model_instructions_file).
# Instructions for this project live in AGENTS.md: `persistent_instructions` is not
# a Codex 0.156 config key, so it would be ignored here.

# Fallback MCP registration (no plugin required). The committed value below is
# repo-root-relative, so start Codex from the repository root, or run
# scripts/setup.sh: scripts/gen-codex-config.sh then writes an absolute launcher
# path to the USER config ($CODEX_HOME/config.toml), which Codex applies with
# higher precedence and which works from any working directory.
# POSIX only: on Windows `sh` is unavailable, so run scripts/setup.ps1, which
# generates plugins/hackathonkit/.mcp.json with the .cmd launcher, or replace
# `command`/`args` below manually.
#
# NOTE: keep `command`/`args` (and every other root-level key) ABOVE the first
# [table] header. TOML tables persist until the next header, so a key placed
# after [mcp_servers.hackathonkit] is parsed as a server option and silently ignored.
#
# `sh <launcher>` (not `sh -c "..."`): the launcher resolves its own repo root
# from its script path, so no shell string interpolation is needed and raw
# shell errors cannot reach the MCP stdio channel. Running it through `sh` also
# avoids depending on the checkout's executable bit.
[mcp_servers.hackathonkit]
command = "sh"
args = ["plugins/hackathonkit/scripts/hackathonkit-mcp-launcher.sh"]
# 180s covers the docker-compose fallback on a cold machine (image pull/build +
# dependency startup). Raise further or pre-build images if your network is slow.
startup_timeout_sec = 180
# Slowest tools: ingestion, quality.gate and research passes. Raise per
# environment if these time out; there is no config-level retry.
tool_timeout_sec = 180
