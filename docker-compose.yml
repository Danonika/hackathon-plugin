name: hackathon-agent-kit

services:
  hackathonkit-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: hackathonkit-mcp
    stdin_open: true
    user: "${HACKATHONKIT_UID:-1000}:${HACKATHONKIT_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
      # The MCP opens the object store once at startup; wait until the MinIO S3
      # API actually accepts connections, otherwise artifact mirroring is
      # silently disabled for the whole session.
      minio:
        condition: service_healthy
    environment:
      HACKATHONKIT_REPO_ROOT: /workspace
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      POSTGRES_DSN: "host=postgres port=5432 sslmode=disable"
      PGUSER: ${POSTGRES_USER:-hackathonkit}
      PGDATABASE: ${POSTGRES_DB:-hackathonkit}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-hackathonkit}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-hackathonkit}
    # data/logs/evals are shared read-write with demo-api by design: the MCP
    # writes artifacts/calls, the demo dashboard writes plan approvals.
    volumes:
      - ./configs:/workspace/configs
      - ./data:/workspace/data
      - ./logs:/workspace/logs
      - ./evals:/workspace/evals

  demo-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: demo-api
    user: "${HACKATHONKIT_UID:-1000}:${HACKATHONKIT_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HACKATHONKIT_REPO_ROOT: /workspace
      HACKATHONKIT_DEMO_PORT: "8787"
      HACKATHONKIT_DEMO_HOST: 0.0.0.0
      HACKATHONKIT_DEMO_TOKEN: ${HACKATHONKIT_DEMO_TOKEN:?set HACKATHONKIT_DEMO_TOKEN in .env}
      POSTGRES_DSN: "host=postgres port=5432 sslmode=disable"
      PGUSER: ${POSTGRES_USER:-hackathonkit}
      PGDATABASE: ${POSTGRES_DB:-hackathonkit}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./configs:/workspace/configs
      - ./data:/workspace/data
      - ./logs:/workspace/logs
      - ./evals:/workspace/evals

  quality:
    build:
      context: .
      dockerfile: Dockerfile
      target: quality
      args:
        HACKATHONKIT_UID: ${HACKATHONKIT_UID:-1000}
        HACKATHONKIT_GID: ${HACKATHONKIT_GID:-1000}
    profiles: ["quality"]
    user: "${HACKATHONKIT_UID:-1000}:${HACKATHONKIT_GID:-1000}"
    working_dir: /workspace
    environment:
      HACKATHONKIT_REPO_ROOT: /workspace
    volumes:
      - ./:/workspace
      - quality-mod-cache:/home/hackathonkit/go-mod
      - quality-build-cache:/home/hackathonkit/go-build

  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hackathonkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hackathonkit}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Reserved for future caching; nothing consumes it yet, so it is optional.
  redis:
    image: redis:7.4.7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    build:
      context: ./docker/minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hackathonkit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
  quality-mod-cache:
  quality-build-cache:
