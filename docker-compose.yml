services:
  hackathonkit-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: hackathonkit-mcp
    stdin_open: true
    environment:
      HACKATHONKIT_REPO_ROOT: /workspace
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      POSTGRES_DSN: postgres://hackathonkit:${POSTGRES_PASSWORD:-hackathonkit}@postgres:5432/hackathonkit?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: hackathonkit
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-hackathonkit123}
      MINIO_BUCKET: hackathonkit
    volumes:
      - ./configs:/workspace/configs
      - ./data:/workspace/data
      - ./logs:/workspace/logs

  demo-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: demo-api
    environment:
      HACKATHONKIT_REPO_ROOT: /workspace
      HACKATHONKIT_DEMO_PORT: "8787"
      HACKATHONKIT_DEMO_HOST: 0.0.0.0
      HACKATHONKIT_DEMO_TOKEN: ${HACKATHONKIT_DEMO_TOKEN:-}
      POSTGRES_DSN: postgres://hackathonkit:${POSTGRES_PASSWORD:-hackathonkit}@postgres:5432/hackathonkit?sslmode=disable
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./configs:/workspace/configs
      - ./data:/workspace/data
      - ./logs:/workspace/logs

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hackathonkit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackathonkit}
      POSTGRES_DB: hackathonkit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hackathonkit
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hackathonkit123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
