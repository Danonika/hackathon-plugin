evaluation:
  technical_target: 95
  demo_day_target: 90

  max_technical_iterations: 2
  max_judge_rounds: 2

  judges: 3
  # Regulation 9.5: a project needs at least three valid scores from
  # non-conflicted jury members. Dropped or conflicted reports are replaced by
  # substitute passes, never counted as zero.
  min_valid_judges: 3
  roast_agents: 3

  parallel_judges: true
  parallel_roast: true

  full_cleanroom_each_iteration: false
  full_cleanroom_on_final_freeze: true

  finalization_reserve_minutes: 45
  min_delta: 0.5
