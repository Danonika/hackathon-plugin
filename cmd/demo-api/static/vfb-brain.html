<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VFB Brain — реальные меши</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #05070f; color: #e2e8f0; font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  .panel { position: fixed; z-index: 5; background: rgba(10,16,32,.82); border: 1px solid #24304d; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; backdrop-filter: blur(6px); }
  #top { top: 12px; left: 12px; max-width: 520px; }
  #top h1 { margin: 0 0 4px; font-size: 15px; }
  #top .muted { color: #8ea3c7; font-size: 11.5px; line-height: 1.5; }
  #top a { color: #93c5fd; }
  #bottom { bottom: 12px; left: 12px; min-width: 340px; }
  .good { color: #22c55e; } .bad { color: #f87171; } .muted { color: #64748b; }
  #err { position: fixed; left: 12px; top: 45%; max-width: 80vw; z-index: 9; background: rgba(80,10,10,.92); border: 1px solid #ef4444; border-radius: 8px; padding: 10px 12px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; display: none; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="scene"></div>
<div class="panel" id="top">
  <h1>🧠 VFB Brain — настоящие меши</h1>
  <div class="muted">регионы Virtual Fly Brain (OBJ, шаблон JRC2018Unisex): saddle FBbt_00045048, medulla · <a href="/fly-body">к мухе</a> · <a href="/mb-3d">схема MB</a> · <a href="/fly-viz">коннектом</a></div>
  <div class="muted" id="status">загрузка мешей…</div>
</div>
<div class="panel" id="bottom">
  <div id="verdict" class="muted">ожидание решения Codex…</div>
  <div style="margin-top:4px"><span class="good" id="pam">PAM 0</span> · <span class="bad" id="ppl1">PPL1 0</span></div>
</div>
<div id="err"></div>
<script>
window.onerror = function (msg, src, line, col) {
  var b = document.getElementById('err');
  b.style.display = 'block';
  b.textContent = 'JS error: ' + msg + '\n' + (src || '') + ':' + line + ':' + col;
};
</script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/OBJLoader.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070f, 0.012);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 500);
camera.position.set(0, 120, 420);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.getElementById('scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x0b1020, 2.2));
const key = new THREE.DirectionalLight(0xfff2dd, 2.6); key.position.set(300, 500, 400); key.castShadow = true; scene.add(key);
const fill = new THREE.DirectionalLight(0x9db4ff, 1.2); fill.position.set(-400, 100, 300); scene.add(fill);
const rim = new THREE.PointLight(0x8b5cf6, 800, 2000); rim.position.set(-400, 200, -400); scene.add(rim);
const grid = new THREE.GridHelper(2000, 40, 0x1e293b, 0x111a2e); grid.position.y = -260; scene.add(grid);

const brain = new THREE.Group();
scene.add(brain);
const matBrain = new THREE.MeshStandardMaterial({ color: 0xf3c9d6, roughness: .55, metalness: .1, side: THREE.DoubleSide });
const matAccent = new THREE.MeshStandardMaterial({ color: 0xd9a066, roughness: .5, metalness: .18, emissive: 0x2a1608, side: THREE.DoubleSide });
const loader = new OBJLoader();

function normalize(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const s = 300 / Math.max(size.x, size.y, size.z, 1e-6);
  obj.scale.setScalar(s);
  obj.position.set(-center.x * s, -center.y * s, -center.z * s);
  return obj;
}

async function loadMeshes() {
  const items = [
    { file: 'saddle_FBbt_00045048.obj', mat: matAccent },
    { file: 'medulla.obj', mat: matBrain }
  ];
  let loaded = 0;
  for (const it of items) {
    try {
      const obj = await loader.loadAsync('/vfb-mesh/' + it.file);
      obj.traverse(n => {
        if (n.isMesh) {
          if (n.geometry && !n.geometry.attributes.normal) n.geometry.computeVertexNormals();
          n.material = it.mat;
          n.castShadow = true;
        }
      });
      brain.add(normalize(obj));
      loaded++;
    } catch (e) { /* skip */ }
  }
  document.getElementById('status').textContent = loaded
    ? 'загружено мешей: ' + loaded + ' · вращается'
    : 'меши не загрузились (проверь /vfb-mesh/)';
}
loadMeshes();

const $ = id => document.getElementById(id);
let reward = true, flashUntil = 0, lastTs = null;
async function poll() {
  try {
    const [fb, neurons] = await Promise.all([
      fetch('/fly-feedback?limit=10').then(r => r.json()),
      fetch('/fly-neuron-events?limit=20').then(r => r.json())
    ]);
    const events = (neurons && neurons.events) || [];
    const last = events.filter(e => e.type === 'feedback').pop();
    if (last && last.ts !== lastTs) {
      lastTs = last.ts;
      reward = !!last.reward;
      flashUntil = performance.now() + 2000;
      $('pam').textContent = 'PAM ' + (last.pam || 0);
      $('ppl1').textContent = 'PPL1 ' + (last.ppl1 || 0);
      $('verdict').innerHTML = reward
        ? '<span class="good">🍬 награда — мозг получает дофамин</span>'
        : '<span class="bad">⚡ ошибка — сигнал боли и голода</span>';
    }
  } catch (e) { /* keep */ }
}
poll(); setInterval(poll, 2500);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  brain.rotation.y = t * 0.18;
  const flashing = performance.now() < flashUntil;
  const glow = flashing ? (reward ? 0.9 : 0.9) : 0.12;
  matBrain.emissive.set(reward ? 0x22c55e : 0xef4444);
  matAccent.emissive.set(reward ? 0x22c55e : 0xef4444);
  matBrain.emissiveIntensity = glow * (0.6 + 0.4 * Math.sin(t * 6));
  matAccent.emissiveIntensity = glow * (0.6 + 0.4 * Math.sin(t * 6 + 1));
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
