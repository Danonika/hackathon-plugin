<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fly Brain 3D — OpenSCAD style</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #05070f; color: #e2e8f0; font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  .panel { position: fixed; z-index: 5; background: rgba(10,16,32,.82); border: 1px solid #24304d; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; backdrop-filter: blur(6px); }
  #top { top: 12px; left: 12px; max-width: 430px; }
  #top h1 { margin: 0 0 4px; font-size: 15px; }
  #top .muted { color: #8ea3c7; font-size: 11.5px; line-height: 1.5; }
  #bottom { bottom: 12px; left: 12px; min-width: 360px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .bar { flex: 1; height: 9px; background: #0f172a; border-radius: 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; transition: width .5s ease; }
  .good { color: #22c55e; } .bad { color: #f87171; } .muted { color: #64748b; }
</style>
</head>
<body>
<div id="scene"></div>
<div class="panel" id="top">
  <h1>🪰 Fly Brain 3D</h1>
  <div class="muted">муха и мозг — по OpenSCAD-модели (MediumPurple/DarkSlateGray/Red/LightCyan; Pink с бугорками)</div>
  <div class="muted" id="status">ожидание события…</div>
</div>
<div class="panel" id="bottom">
  <div class="row"><span style="width:70px">Голод</span><div class="bar"><span id="hunger" style="width:40%;background:linear-gradient(90deg,#f97316,#ef4444)"></span></div><span id="hunger-val" class="muted">40%</span></div>
  <div class="row"><span style="width:70px">Дофамин</span><div class="bar"><span id="dopa" style="width:0%;background:linear-gradient(90deg,#22c55e,#86efac)"></span></div><span id="dopa-val" class="muted">0</span></div>
  <div id="verdict" class="muted">ожидание решения Codex (routing.fly_feedback)…</div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070f, 0.02);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 6.5, 26);
camera.lookAt(0, 4.2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.getElementById('scene').appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x9db4ff, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(12, 18, 14); key.castShadow = true; scene.add(key);
const rim = new THREE.PointLight(0x8b5cf6, 60, 80); rim.position.set(-14, 12, -12); scene.add(rim);

const grid = new THREE.GridHelper(80, 40, 0x1e293b, 0x111a2e); scene.add(grid);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x070b14, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

function flyModel() {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x9370db, roughness: .5, metalness: .1 });
  const headMat = new THREE.MeshStandardMaterial({ color: 0x2f4f4f, roughness: .5, metalness: .1 });
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff2d2d, roughness: .25, metalness: .5 });
  const wingMat = new THREE.MeshStandardMaterial({ color: 0xe0ffff, transparent: true, opacity: .6, roughness: .15, side: THREE.DoubleSide });

  const body = new THREE.Mesh(new THREE.SphereGeometry(10, 48, 32), bodyMat);
  body.scale.set(1.2, 2, 1); g.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(6, 40, 28), headMat);
  head.position.set(0, 18, 2); g.add(head);

  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(3, 28, 20), eyeMat);
    eye.position.set(4 * s, 21, 5); g.add(eye);
  }

  const wings = [];
  for (const s of [-1, 1]) {
    const wing = new THREE.Mesh(new THREE.SphereGeometry(5, 32, 20), wingMat);
    wing.position.set(6 * s, -2, 6);
    wing.rotation.set(THREE.MathUtils.degToRad(10), THREE.MathUtils.degToRad(20 * s), THREE.MathUtils.degToRad(-35 * s));
    wing.scale.set(2, 4, 0.1);
    g.add(wing); wings.push(wing);
  }
  g.traverse(n => { if (n.isMesh) n.castShadow = true; });
  return { group: g, wings };
}

function brainHalf() {
  const half = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: .6, metalness: .05 });
  const core = new THREE.Mesh(new THREE.SphereGeometry(15, 40, 28), mat);
  core.scale.set(0.7, 1.4, 1); half.add(core);
  const bumpGeo = new THREE.SphereGeometry(1, 14, 10);
  for (let x = -10; x <= 10; x += 4) {
    for (let y = -18; y <= 18; y += 4) {
      if (x * x + y * y < 250) {
        const z = Math.sqrt(Math.max(0, 225 - (x * x + y * y * 0.5)));
        const r = 2.5 + Math.sin(x * 5) * 0.5;
        const bump = new THREE.Mesh(bumpGeo, mat);
        bump.position.set(x * 0.8, y, z * 0.9);
        bump.scale.setScalar(r);
        bump.castShadow = true;
        half.add(bump);
      }
    }
  }
  return { group: half, mat };
}

function brainModel() {
  const g = new THREE.Group();
  const left = brainHalf(); left.group.position.set(-1.5, 0, 0);
  const right = brainHalf(); right.group.position.set(1.5, 0, 0); right.group.scale.x = -1;
  g.add(left.group); g.add(right.group);
  return { group: g, mat: left.mat };
}

const fly = flyModel(); fly.group.scale.setScalar(0.16); fly.group.position.set(-5.5, 3.4, 0); fly.group.rotation.y = Math.PI / 2;
scene.add(fly.group);

const brain = brainModel(); brain.group.scale.setScalar(0.16); brain.group.position.set(5.5, 5.2, 0);
scene.add(brain.group);
const brainLight = new THREE.PointLight(0x22c55e, 0, 30); brainLight.position.set(5.5, 5.2, 0); scene.add(brainLight);

const sugar = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0x6b5300, roughness: .4 }));
sugar.position.set(3.4, 0.7, 3.4); sugar.castShadow = true; scene.add(sugar);

const state = { hunger: 40, dopamine: 0, mode: 'idle', lastTrace: null, lastFeedbackTs: null };
const target = new THREE.Vector3(-5.5, 3.4, 0);
const $ = id => document.getElementById(id);

function setBrainGlow(color, intensity) {
  brain.mat.emissive.set(color);
  brain.mat.emissiveIntensity = intensity;
  brainLight.color.set(color);
  brainLight.intensity = intensity > 0 ? 12 : 0;
}

async function poll() {
  try {
    const [feedback, neurons] = await Promise.all([
      fetch('/fly-feedback?limit=10').then(r => r.json()),
      fetch('/fly-neuron-events?limit=20').then(r => r.json())
    ]);
    const neuronEvents = neurons.events || [];
    const lastNeuron = neuronEvents[neuronEvents.length - 1];
    if (lastNeuron && lastNeuron.type === 'recommend' && lastNeuron.trace_id !== state.lastTrace) {
      state.lastTrace = lastNeuron.trace_id;
      $('status').textContent = 'encoder: ' + (lastNeuron.encoder || '?') + ' · route: ' + (lastNeuron.route || '?') +
        ' · max ' + (lastNeuron.max_score ?? '?');
    }
    const fb = (feedback.events || [])[(feedback.events || []).length - 1];
    if (fb && fb.ts !== state.lastFeedbackTs) {
      state.lastFeedbackTs = fb.ts;
      const reward = fb.source === 'accepted' || fb.source === 'normal-teacher';
      const feedbackNeuron = neuronEvents.filter(e => e.type === 'feedback').pop() || {};
      if (reward) {
        state.dopamine = Math.min(100, state.dopamine + 22);
        state.hunger = Math.max(0, state.hunger - 18);
        state.mode = 'reward';
        target.set(3.4, 1.6, 3.4);
        setBrainGlow(0x22c55e, 0.9);
        $('verdict').innerHTML = '<span class="good">🍬 награда · PAM ' + (feedbackNeuron.pam ?? 0) + ' · муха ест сахар</span>';
      } else {
        state.dopamine = Math.max(0, state.dopamine - 10);
        state.hunger = Math.min(100, state.hunger + 25);
        state.mode = 'punish';
        target.set(-8.5, 2.2, 4.5);
        setBrainGlow(0xef4444, 0.9);
        $('verdict').innerHTML = '<span class="bad">⚡ ошибка · PPL1 ' + (feedbackNeuron.ppl1 ?? 0) + ' · боль и голод</span>';
      }
      $('hunger').style.width = state.hunger + '%';
      $('hunger-val').textContent = Math.round(state.hunger) + '%';
      $('dopa').style.width = state.dopamine + '%';
      $('dopa-val').textContent = Math.round(state.dopamine);
    }
  } catch (e) {
    $('status').textContent = 'offline: ' + e.message;
  }
}
poll(); setInterval(poll, 2500);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  fly.wings.forEach((w, i) => { w.rotation.z += Math.sin(t * 40) * 0.02 * (i ? 1 : -1); });
  const hover = Math.sin(t * 2.2) * 0.25;
  if (state.mode === 'reward' || state.mode === 'punish') {
    fly.group.position.lerp(target, .03);
    if (state.mode === 'punish') {
      fly.group.position.x += Math.sin(t * 60) * .03;
      fly.group.position.y += Math.cos(t * 70) * .02;
    }
    if (fly.group.position.distanceTo(target) < 0.8) state.mode = 'idle';
  } else {
    target.set(-5.5, 3.4 + hover, 0);
    fly.group.position.lerp(target, .02);
  }
  if (state.mode === 'idle') setBrainGlow(0x7c3aed, 0.15 + 0.1 * Math.sin(t * 2));
  sugar.scale.setScalar(state.mode === 'reward' && fly.group.position.distanceTo(sugar.position) < 2.4 ? .55 : 1);
  brain.group.rotation.y += .0018;
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
