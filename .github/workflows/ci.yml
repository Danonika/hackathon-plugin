name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: quality gate (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: hooks behavior
        run: node plugins/hackathonkit/scripts/hooks.test.js
      - name: shell regression tests
        run: |
          sh scripts/env-set.test.sh
          sh scripts/smoke.test.sh
          sh scripts/verify-command.test.sh
          sh scripts/set-version.test.sh
          sh scripts/codex-config.test.sh
      - name: quality gate
        run: ./scripts/quality-gate.sh
      - name: clean-checkout rehearsal
        run: |
          if ! go run ./cmd/hackathonkit-rehearse --json > rehearsal.json; then
            cat rehearsal.json
            exit 1
          fi

  docker:
    name: docker stack (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # One staged check: compose config, builds, infra readiness, MCP selftest,
      # quality image and the compose handshake. Aligns HACKATHONKIT_UID/GID with the
      # runner so bind mounts stay writable, and dumps diagnostics on failure.
      - name: docker stack check
        run: sh scripts/docker-check.sh --full
      - name: docker diagnostics on failure
        if: failure()
        run: |
          redact() {
            sed -E -e 's#://[^/@ ]+@#://***@#g' -e 's/([A-Za-z_]*(PASSWORD|PASS|TOKEN|SECRET|DSN|KEY)[A-Za-z_]*)([=: ]+)[^ "]+/\1\3[redacted]/g'
          }
          docker compose ps -a 2>&1 | redact || true
          docker compose logs --no-color --tail=200 2>&1 | redact || true
          docker compose --profile quality logs --no-color --tail=100 2>&1 | redact || true

  windows:
    name: windows (hooks + tests)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: build windows binary
        run: go build -o bin/hackathonkit-mcp.exe ./cmd/hackathonkit-mcp
      - name: go tests
        run: go test ./...
      - name: hooks behavior (real .exe lookup)
        run: node plugins/hackathonkit/scripts/hooks.test.js
      - name: selftest and skill validator
        run: |
          ./bin/hackathonkit-mcp.exe --selftest
          ./bin/hackathonkit-mcp.exe --validate-skills
